const ALLP=()=>[...PROGS,...(S.custom||[])];
const PROG=()=>ALLP().find(p=>p.id==(S.prog||'ulppl'))||PROGS[0];
const isU=()=>(S.prog||'ulppl')=='ulppl';

function rowToEx(r,p,wk){
 if(p.id.startsWith('cb')){const [n,wu,s,rp,it,note]=r,pk=v=>Array.isArray(v)?v[Math.min(wk-1,v.length-1)]:v,iv=String(pk(it)),pct=iv[0]=='%';
  return{n,wu:String(wu),sets:+pk(s),reps:String(pk(rp)),rpe:pct?'':iv,pct:pct?iv.slice(1):'',rest:pct?180:120,alt:(p.alt&&p.alt[n])||[],note:note||'',ss:0,tech:''}}
 const [n,wu,sets,reps,rpe,rest,alt,note,flag,tech,pct]=r,dr=flag=='drop'||flag=='dropL';
 return{n,wu:String(wu??''),sets:+sets||1,reps:String(reps),rpe:String(rpe??''),rest:+rest||0,alt:((alt&&alt.length?alt:p.alt&&p.alt[n])||[]).filter(Boolean),note:note||'',ss:flag=='ss'?1:0,tech:dr?'DS':(tech||''),techAll:flag=='drop'||tech=='IP'?1:0,pct:pct||''}}

function deal(p){if(S.deal&&S.deal.d==dkey())return S.deal.ex;const deck=[];for(let s=0;s<4;s++)for(let v=2;v<=14;v++)deck.push([s,v]);
 for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 const cnt=[0,0,0,0],ex=[],VN={11:'Vale',12:'Kız',13:'Papaz',14:'As'};
 for(const [s,v] of deck.slice(0,20)){if(v==14){if(ex.length)ex[ex.length-1].rest=120;continue}
  const [sym,,list]=p.suits[s],[n,alts]=list[cnt[s]++%list.length],reps=v<=10?v+10:20;
  ex.push({n,sets:1,reps:String(reps),rest:0,alt:alts,note:`Kart: ${sym} ${VN[v]||v}. `+((p.notes||{})[n]||''),ss:0,tech:'',rpe:'',wu:''})}
 S.deal={d:dkey(),ex};return ex}
function genW(p,wk){if(p.card)return{w:{'C.A.R.D.':deal(p)},sched:p.sched};
 const b=blockFor(p,wk),days=p.days||(b&&b.days)||[],w={};days.forEach(([nm2,rows])=>w[nm2]=rows.map(r=>rowToEx(r,p,wk)));

 S.prog=id;S.pdone=0;S.pgStart=S.pgStart||{};if(!S.pgStart[id])S.pgStart[id]=Date.now();const st=S.ps[id]||{},p=PROG();S.week=st.week||1;S.plan=null;S.wkAt=monTime();

function copyProg(p){const src=p.editable?{w:p.id==S.prog?S.w:(p.w||DEF),sched:p.sched}:genW(p,p.id==S.prog?S.week:1);

function autoWeek(){if(S.autoWk===false||nWk()<2)return;if(!S.wkAt){S.wkAt=monTime();return}

async function shareFile(name,text,type,title){const blob=new Blob([text],{type});
try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return true}}catch(e){if(e&&e.name=='AbortError')return false}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}

// Atlanan hareketler (r.sk) sıralamada ve süperset eşleşmesinde yok sayılır.
function nextPos(r){const ex=RX(r),e=ex[r.ei],sk=r.sk||[],ok=i=>!sk.includes(i);
// Süperset grubu: "sonrakiyle süperset" işaretiyle birbirine bağlı ardışık hareketler (2, 3 ya da daha fazla).
// Grup içinde her tur tüm hareketler dinlenmesiz yapılır; tur bitince dinlenilir ve sıradaki tura geçilir.
let g0=r.ei,g1=r.ei;while(g0>0&&ex[g0-1].ss)g0--;while(g1<ex.length-1&&ex[g1].ss)g1++;
if(g1>g0){for(let j=r.ei+1;j<=g1;j++)if(ok(j)&&r.si<ex[j].sets)return{ei:j,si:r.si,free:1};
 for(let s=r.si+1;s<Math.max(...ex.slice(g0,g1+1).map(x=>x.sets));s++)for(let j=g0;j<=g1;j++)if(ok(j)&&s<ex[j].sets)return{ei:j,si:s}}
else if(r.si+1<e.sets)return{ei:r.ei,si:r.si+1};
let j=g1+1;while(j<ex.length&&!ok(j))j++;return j<ex.length?{ei:j,si:0}:null}
function finish(r){r.done=true;r.dur=Math.round(elapsed(r));S.log.push({d:new Date().toISOString(),w:r.w,wk:S.week,pg:S.prog,dur:r.dur,log:r.log,...(r.chk?{chk:r.chk}:{})});r.li=S.log.length-1;const bn=badges().filter(b=>b.ok);if(!S.badges){S.badges=bn.map(b=>b.id);r.nb=[]}else{r.nb=bn.filter(b=>!S.badges.includes(b.id)).map(b=>b.t+": "+b.d);S.badges=bn.map(b=>b.id)}}
// Seti atla: set "atlandı" olarak kaydedilir (toplam sete sayılmaz), dinlenme olmadan sıradaki sete geçilir.
function skipSet(r){const e=RX(r)[r.ei];let l=r.log.find(x=>x.ei==r.ei);if(!l){l={ei:r.ei,n:nm(e),s:[]};r.log.push(l)}
l.s.push({skip:1});delete r.cs;delete r.dkg;delete r.drp;
const nx=nextPos(r);if(!nx)finish(r);else{r.ei=nx.ei;r.si=nx.si;r.phase='set'}}
const setCount=log=>log.reduce((a,l)=>a+l.s.filter(x=>!x.skip).length,0);

function suggest(e,cn,si,pv){const s=suggest0(e,cn,si,pv),rg=repRange(e.reps);

 const ss=pv?pv.l.s.filter(x=>!x.skip):[],ps=ss.length?ss[Math.min(si,ss.length-1)]:null,pk=ps?num(ps.kg):0,pr=ps?num(ps.r):0;
 s.rp=!ps||s.kg!=pk?rg[0]:/tükenişe/.test(s.why)?pr:Math.min(rg[1],pr+1);return s}
function suggest0(e,cn,si,pv){const rnd=isBar(cn)?r25:r05;
 if(e.pct){const b=bestE1(cn),ps=(e.pct.replace(/,/g,'.').match(/[\d.]+/g)||[]).map(Number);if(b&&ps.length){const p=ps.reduce((a,x)=>a+x,0)/ps.length/100;return{kg:rnd(b*p),why:`1RM tahminin ${fnum(b)} kg, bunun %${e.pct}'i`}}}
 if(!pv)return null;const ss=pv.l.s.filter(x=>!x.skip);if(!ss.length)return null;const ps=ss[Math.min(si,ss.length-1)],kg=num(ps.kg),rp=num(ps.r),rg=repRange(e.reps);if(!kg)return null;
 if(!rg)return{kg,why:'geçen seferki ağırlık'};
 const pr=num(ps.rpe);
 if(pr&&pr>=10&&rp<rg[1])return{kg,why:`geçen sefer ${fnum(kg)}×${rp} tükenişe yakındı (RPE ${pr}), aynı ağırlıkta kal`};

 if(rp<rg[0]-2)return{kg:rnd(kg*0.95),why:`geçen sefer ${fnum(kg)}×${rp}, hedefin altında kaldın, biraz hafiflet`};
 return{kg,why:`geçen sefer ${fnum(kg)}×${rp}, aynı ağırlıkla bir tekrar fazlasını dene`}}

function plates(kg){const bar=S.bar??20,side=(kg-bar)/2;if(!(kg>0))return'';if(side<0)return`Bar tek başına ${fnum(bar)} kg.`;if(side==0)return'Sadece bar.';

function prsOf(log,before){const out=[];for(const l of log){if(l.cardio||out.some(x=>x.startsWith(l.n+':')))continue;const b=best(l);if(!b)continue;

 const mk=Math.max(...prev.map(x=>best(x).kg)),me=Math.max(...prev.map(e1)),ce=e1(l);
 if(b.kg>mk)out.push(`${l.n}: en ağır ${fnum(b.kg)} kg (önceki ${fnum(mk)} kg)`);else if(ce>me+0.01)out.push(`${l.n}: tahmini 1RM ${fnum(ce)} kg (önceki ${fnum(me)} kg)`)}return out}

{t:'Takviyeler',s:'Hangi takviyeler gerçekten işe yarar?',yap:['Kreatin monohidrat: günde 3-5 g; yükleme dönemi şart değil. En çok çalışılmış ve sağlıklı kişilerde güvenli bulunmuş takviye.','Kafein: antrenmandan yaklaşık 1 saat önce kilogram başına 3-6 mg (70 kg için 200-400 mg, yaklaşık 2-4 fincan kahve) performansı artırabilir.','Önce temel: yeterli protein, uyku ve düzenli antrenman. Takviyeler bunların üstüne küçük katkı yapar.'],kac:['Kilogram başına 9 mg gibi çok yüksek kafein dozları; yan etkiler artar, fayda artmaz.','Akşam antrenmanından önce kafein; uykunu bozar.','Kalp, böbrek ya da başka sağlık sorunun varsa doktora sormadan takviye kullanmak.'],neden:'2021 tarihli derleme kreatinin güvenli ve etkili olduğunu, 2021 tarihli pozisyon bildirisi de kafeinin 3-6 mg/kg dozda performansı tutarlı şekilde artırdığını belirtiyor.',app:'Uygulama takviye takibi yapmaz; bu rehber sadece bilgi içindir.',src:['ant','gue']},
{t:'Uyku',s:'Uyku antrenmanı ne kadar etkiler?',yap:['Gece 7 saatin üstünde uyumayı hedefle.','Kötü uyuduğun günlerde antrenmanı mümkünse günün erken saatine al ve hafif tut.','Uyku düzenini hafta sonu da koru.'],kac:['6 saatten az uyuyup en ağır antrenmanını yapmayı denemek.'],neden:'2022 meta-analizi, 6 saat ve altındaki uykunun güç, dayanıklılık ve beceri performansını düşürdüğünü; uyanık kalınan her saatle performansın biraz daha azaldığını gösterdi.',app:'Antrenman öncesi "Nasılsın?" sorularında uykunu "Kötü" işaretlersen uygulama o gün hafif çalışmayı önerir. Uyku süreni Sağlık kestirmesiyle aktarırsan Raporlar, uykunun performansına etkisini gösterir.',src:['cra']},
{t:'Kardiyo ve kas',s:'Kardiyo kas gelişimini engeller mi?',yap:['Kardiyo yapmaktan çekinme; kalp sağlığın için önemli ve kas gelişimini genelde engellemez.','Haftada 150 dakika orta tempolu kardiyo iyi bir hedef.','Mümkünse kardiyoyu ağırlıktan sonra ya da farklı bir günde yap.'],kac:['Sıçrama, sprint gibi patlayıcı güç hedefin varsa kardiyo ile kuvveti aynı seansta yapmak.'],neden:'43 çalışmayı inceleyen 2022 meta-analizi, kardiyonun kas büyümesini ve maksimum gücü azaltmadığını; sadece patlayıcı gücü, özellikle aynı seansta yapıldığında, biraz azaltabildiğini buldu.',app:'Ana ekrandaki kardiyo hedefiyle haftalık dakikanı takip edebilirsin.',src:['shu','who']}];

<p class="mut small">Bu rehberler genel bilgilendirme içindir, doktor veya diyetisyen tavsiyesi yerine geçmez. Kalp, tansiyon, eklem, böbrek gibi bir sağlık sorunun varsa başlamadan önce doktoruna danış.</p>`}

<div class="lab">Neden?</div><p>${esc(g.neden)}</p>${g.app?`<p class="tip"><b>Uygulamada:</b> ${esc(typeof g.app=='function'?g.app():g.app)}</p>`:''}
<div class="lab">Kaynaklar</div><ul class="src">${g.src.map(k=>`<li>${esc(SRC[k][0])} <a href="${SRC[k][1]}" target="_blank" rel="noopener">Makaleyi aç</a></li>`).join('')}</ul>
<div class="two" style="margin-top:16px">${V.gi>0?`<button class="btn alt" data-a="gv" data-i="${V.gi-1}">‹ Önceki</button>`:'<span></span>'}${V.gi<GUIDES.length-1?`<button class="btn alt" data-a="gv" data-i="${+V.gi+1}">Sonraki ›</button>`:''}</div>`}
// Haftalık set eşiği: yeni başlayanlarda düşük hacim de yeterli (bkz. "Kaç set yapmalıyım?" rehberi).
const volLow=()=>userLevel()=='Başlangıç'?6:10;
// ---- "Makine dolu": şu anki hareketi, henüz başlanmamış ve süperset grubunda olmayan ilk hareketle değiştir ----
const inSS=(ex,i)=>!!(ex[i]&&(ex[i].ss||(i>0&&ex[i-1].ss)));
function busyCand(r){const ex=RX(r);if(inSS(ex,r.ei)||r.log.some(l=>l.ei==r.ei&&(l.s.length||l.wu)))return -1;
 const cur=nm(ex[r.ei]);for(let j=r.ei+1;j<ex.length;j++)if(!inSS(ex,j)&&nm(ex[j])!=cur&&!r.log.some(l=>l.ei==j))return j;return -1}
function busySwap(r){const j=busyCand(r);if(j<0){V.msg='Yer değiştirilebilecek, henüz başlanmamış bir hareket kalmadı.';return}
 r.ex=r.ex||clone(RX(r));const a=nm(r.ex[r.ei]);[r.ex[r.ei],r.ex[j]]=[r.ex[j],r.ex[r.ei]];delete r.dkg;delete r.drp;delete r.drpe;delete r.cs;
 V.msg=`${a} dolu: önce ${nm(r.ex[r.ei])} yapılıyor, ${a} sonraya alındı.`}
// ---- Sıradaki program önerisi: gün sayısı, seviye, geride kalan kas grupları ve çeşitlilik ----
const PLEVEL={ulppl:'Orta',ess3:'Her seviye',pbb2:'Orta/ileri',pb3:'Orta/ileri','fund-fb':'Başlangıç','fund-lu':'Başlangıç','fund-bps':'Başlangıç','cb-ppl':'Dönüş','cb-ul':'Dönüş',card:'Ev'};
const pLevel=p=>PLEVEL[p.id]||((p.desc||'').match(/Seviye: ([^.]+)/)||[])[1]||'Her seviye';
function userLevel(){if(!S.log.length)return'Başlangıç';const wks=(Date.now()-new Date(S.log[0].d))/(7*864e5);return wks<12?'Başlangıç':wks<52?'Orta':'İleri'}
function progMus(p){const w=p.editable?(p.id==S.prog?S.w:(p.w||DEF)):genW(p,1).w,sc=p.editable&&p.id==S.prog?S.sched:p.sched,t={};(sc||[]).forEach(d=>{if(d&&w[d])Object.entries(musLoad(w[d])).forEach(([k,v])=>t[k]=(t[k]||0)+v)});return t}
function suggestProgs(n=3){const cur=PROG(),days=DPW({sched:S.sched})||DPW(cur),lvl=userLevel(),cm=progMus(cur),lag=Object.keys(cm).filter(k=>k!='Diğer'&&cm[k]<10);
 const last=S.log[S.log.length-1],away=last?(Date.now()-new Date(last.d))/864e5:0,used=new Set(S.log.map(h=>h.pg||'ulppl'));
 return ALLP().filter(p=>p.id!=cur.id&&!p.custom).map(p=>{let sc=0;const why=[],pl=pLevel(p),dp=DPW(p);
  sc-=Math.abs(dp-days)*6;if(dp==days)why.push(`haftada ${dp} gün, şu anki düzeninle aynı`);else why.push(`haftada ${dp} gün`);
  if(pl=='Dönüş'){if(away>30){sc+=8;why.push('uzun aradan sonra dönüş için')}else sc-=20}
  else if(pl=='Ev'){sc-=(S.noEq||[]).includes('Barbell')?0:15}
  else if(pl=='Her seviye'||pl.includes(lvl)||(lvl=='Orta'&&/orta/i.test(pl))||(lvl=='İleri'&&/ileri/i.test(pl))){sc+=4;why.push(pl=='Her seviye'?'her seviyeye uygun':`${pl.toLocaleLowerCase('tr')} seviye, sana uygun`)}else if(lvl=='Başlangıç'&&/ileri/i.test(pl))sc-=6;
  if(lag.length){const pm=progMus(p),up=lag.filter(k=>(pm[k]||0)>=(cm[k]||0)+3);if(up.length){sc+=Math.min(up.length,2)*2;why.push(`${up.slice(0,3).join(', ')} için daha çok set`)}}
  if(!used.has(p.id)){sc+=2;why.push('daha önce yapmadın')}return{p,sc,why}}).sort((a,b)=>b.sc-a.sc).slice(0,n)}
function sugV(title){const L=suggestProgs();return L.length?`<div class="lab">${title}</div><div class="list">${L.map(({p,why})=>`<button class="li" data-a="pv" data-v="${p.id}"><span>${esc(p.name)}<span class="sub">${esc(why.join(', '))}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}</div>
<p class="mut small">Senin seviyen (${userLevel().toLocaleLowerCase('tr')}) antrenman geçmişinin süresine göre tahmin edildi.</p>`:''}
// ---- Isınma setlerini kaydetme (isteğe bağlı; rekor, hacim ve set sayısına katılmaz) ----
function warmLog(r){const kg=document.getElementById('kg').value,rp=document.getElementById('rp').value;if(rp===''){document.getElementById('rp').focus();return}
 const e=RX(r)[r.ei],cn=nm(e);let l=r.log.find(x=>x.ei==r.ei);if(!l){l={ei:r.ei,n:cn,s:[]};r.log.push(l)}(l.wu=l.wu||[]).push({kg:kg||'0',r:rp});delete r.drp}
// ---- Süre kısaltıcı: izolasyon setlerini azalt, süperset yap, izolasyon çıkar, bileşik set azalt, dinlenmeyi kısalt ----
const isIso=e=>{const n=nm(e);return['Biceps','Triceps','Baldır','Karın','Trapez'].includes(musOf(n))||/lateral|raise|fly|flye|pec deck|face ?pull|reverse pec|rear delt|abduction|adduction|leg extension|leg curl|pullover|pull-in|pull-apart|kickback/i.test(n)};
const estMin=ex=>ex.reduce((a,e)=>a+(+e.sets||0)*((e.ss?0:+e.rest||0)+40),0)/60;
function shorten(ex,T){if(!T)return{ex,note:''};const s0=ex.reduce((a,e)=>a+(+e.sets||0),0),n0=ex.length,E=()=>estMin(ex),full=Math.round(E());if(full<=T)return{ex,note:`Antrenman zaten yaklaşık ${full} dakika; değişiklik gerekmedi.`};
 for(let i=ex.length-1;i>=0&&E()>T;i--)if(isIso(ex[i])&&ex[i].sets>1)ex[i].sets--;
 let ssN=0;for(let i=0;i<ex.length-1&&E()>T;i++){const a=ex[i],b=ex[i+1];if(!a.ss&&!(i>0&&ex[i-1].ss)&&!b.ss&&isIso(a)&&isIso(b)&&musOf(nm(a))!=musOf(nm(b))){a.ss=1;a.rest=0;ssN++;i++}}
 for(let i=ex.length-1;i>=0&&E()>T;i--)if(isIso(ex[i])&&!ex[i].ss&&!(i>0&&ex[i-1].ss))ex.splice(i,1);
 for(let k=0;k<3&&E()>T;k++)for(let i=ex.length-1;i>=0&&E()>T;i--)if(ex[i].sets>2)ex[i].sets--;
 let rc=0;if(E()>T)ex.forEach(e=>{if(!e.ss){const m=isIso(e)?60:120;if(+e.rest>m){e.rest=m;rc=1}}});

function perKeys(mode,n){const out=[];if(mode=='w'){const c=new Date(wkKey(Date.now()));for(let i=n-1;i>=0;i--){const x=new Date(c);x.setDate(x.getDate()-7*i);out.push(x.getTime())}}else{const c=moKey(Date.now());for(let i=n-1;i>=0;i--)out.push(c-i)}return out}

function agg(mode){const m=new Map();for(const h of S.log){const k=perOf(mode,h.d);let a=m.get(k);if(!a)m.set(k,a={n:0,sets:0,vol:0,dur:0,car:0});a.n++;a.dur+=h.dur||0;

const d=h>0?`M${x},${T+ph}V${y+rr}Q${x},${y} ${x+rr},${y}H${x+bw-rr}Q${x+bw},${y} ${x+bw},${y+rr}V${T+ph}Z`:'';

function lineChart(pts,aria){const W=440,H=196,L=48,R=46,T=16,B=26,pw=W-L-R,ph=H-T-B,vs=pts.map(p=>p.val),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||Math.max(mx*.2,5);

else if(a=='delw'){delete S.w[d.w];S.sched=S.sched.map(x=>x==d.w?'':x);if(S.plan)S.plan.days=S.plan.days.map(x=>x==d.w?'':x);save()}
save();render()});
// Yazarken her tuşta kaydetmek yerine yazma bitince kaydet; uygulama arka plana geçerse hemen kaydet.
let sT=0;const saveSoon=()=>{clearTimeout(sT);sT=setTimeout(save,500)};

app.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
if(V.view=='hedit'&&S.log[V.hi]){const h=S.log[V.hi];if(d.he=='w'){h.w=t.value;saveSoon();return}if(d.he=='d'){const x=new Date(t.value);if(!isNaN(x)){h.d=x.toISOString();S.log.sort((a,b)=>new Date(a.d)-new Date(b.d));V.hi=S.log.indexOf(h)}saveSoon();return}
 if(d.hn!=null){h.log[+d.hn].n=t.value;saveSoon();return}if(d.hs!=null){const x=h.log[+d.hs].s[+d.j];delete x.skip;x[d.f]=t.value;saveSoon();return}}
if(d.k=='cgoal'){S.cgoal=Math.max(0,parseInt(t.value)||0);saveSoon();return}
if(d.k=='bw'){S.bw=num(t.value)||0;saveSoon();return}
if(t.id=='axn'){V.axq=t.value;const rs=document.getElementById('axres');if(rs)rs.innerHTML=exSearch(t.value);return}
if(t.id=='wn'&&V.run&&S.log[V.run.li]){S.log[V.run.li].note=t.value;saveSoon();return}
if(d.ms!=null){S.mset=S.mset||{};const m=S.mset[d.ms]=S.mset[d.ms]||[],ins=t.parentElement.querySelectorAll('input');m[+d.j]=[ins[0].value,ins[1].value];saveSoon();return}
if(t.id=='kg'&&V.run){const pl=document.getElementById('pl');if(pl)pl.textContent=plates(num(t.value));const wu=document.getElementById('wu'),r=V.run;if(wu)wu.textContent=warmup(RX(r)[r.ei],num(t.value))}
if(t.id=='nt'){S.notes=S.notes||{};if(t.value.trim())S.notes[d.n]=t.value;else delete S.notes[d.n];saveSoon();return}if((t.id=='kg'||t.id=='rp')&&V.run){V.run['d'+t.id]=t.value;saveSoon();return}if(!d.k||d.k=='wn')return;const e=S.w[d.w]&&S.w[d.w][+d.i];if(!e)return;
e[d.k]=t.type=='checkbox'?(t.checked?1:0):(d.k=='sets'||d.k=='rest')?Math.max(1,Number(t.value)||1):t.value;saveSoon()});
app.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.a=='sched'){S.sched[V.day]=t.value;if(planOn())S.plan.days[V.day]=t.value;save();render()}
else if(d.a=='week'){S.week=+t.value;S.wkAt=monTime();regen();save();render()}
else if(d.k=='pname'){const v=t.value.trim();if(v&&PROG().custom){PROG().name=v;save()}}

else if(d.k=='ctime'){S.ctime=t.value;save()}
else if(d.a=='rx'){V.rx=t.value;render()}
else if(d.k=='wn'){const n=t.value.trim();if(n&&n!=d.w&&!S.w[n]){S.w[n]=S.w[d.w];delete S.w[d.w];S.sched=S.sched.map(x=>x==d.w?n:x);if(S.plan)S.plan.days=S.plan.days.map(x=>x==d.w?n:x);save()}render()}});

const showTip=ev=>{const g=ev.target.closest&&ev.target.closest('[data-tip]');if(!g)return;const f=g.closest('figure');if(!f)return;
f.querySelector('.ro').textContent=g.dataset.tip;f.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));g.classList.add('act')};

// Giriş ekranı: düğmeyi sağa sürükle ya da ekranı yukarı kaydır.
let drag=null;
app.addEventListener('pointerdown',ev=>{if(V.view!='splash')return;const k=ev.target.closest('.knob');
if(k){const t=k.parentElement;drag={k,t,x0:ev.clientX,x:0,max:t.clientWidth-k.offsetWidth-8};try{k.setPointerCapture(ev.pointerId)}catch(e){}k.style.transition='none'}else drag={y0:ev.clientY}});
app.addEventListener('pointermove',ev=>{if(!drag||!drag.k)return;drag.x=Math.max(0,Math.min(drag.max,ev.clientX-drag.x0));drag.k.style.transform=`translateX(${drag.x}px)`;drag.t.querySelector('.tl').style.opacity=1-drag.x/drag.max});
function dragEnd(ev,cancel){if(!drag)return;const g=drag;drag=null;
if(g.k){g.k.style.transition='';if(!cancel&&g.x>g.max*.7){g.k.style.transform=`translateX(${g.max}px)`;setTimeout(enter,180)}else{g.k.style.transform='';g.t.querySelector('.tl').style.opacity=''}}
else if(!cancel&&g.y0-ev.clientY>60)enter()}
app.addEventListener('pointerup',ev=>dragEnd(ev));app.addEventListener('pointercancel',ev=>dragEnd(ev,1));
document.getElementById('impf').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;

S=mig(s);S.run=null;regen();V={view:'main',day:today(),run:null};save();render();alert('Yedek geri yüklendi.')}
catch(e){alert('Bu dosya geçerli bir antrenman yedeği değil.')}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
