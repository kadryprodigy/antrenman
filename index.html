.up{margin-top:24px}.up summary{display:flex;justify-content:space-between;align-items:center;list-style:none;cursor:pointer;padding:12px 14px;background:var(--sf);border-radius:6px;font-weight:700}

.lead{font-size:18px;margin:0 0 14px}
.hl{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.sq{width:12px;height:12px;border-radius:2px;background:var(--pc);flex:none}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}.g3 label{font-size:12px;font-weight:600;color:var(--mut)}
.exa{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{font-size:14px;display:flex;align-items:center;gap:8px}input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.splash{min-height:calc(100vh - 46px);min-height:calc(100svh - 46px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.sp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:6px}
.brand{font-size:26px}
.sp-plate{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 18px 20px}
.sp-lab{font-weight:700;font-size:15px}
.sp-w{font-size:clamp(84px,30vw,140px);line-height:.85;margin:6px 0 12px;overflow-wrap:anywhere}
.sp-m{font-size:15px;margin:0}
.track{position:relative;height:60px;border-radius:6px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--line)}
.tl{position:absolute;inset:0;display:grid;place-items:center;padding-left:56px;color:var(--mut);font-weight:700;font-size:15px;pointer-events:none}
.knob{position:absolute;left:5px;top:5px;width:50px;height:50px;border-radius:4px;border:0;background:var(--ink);color:var(--bg);cursor:grab;touch-action:none;transition:transform .25s ease}
.knob::before{content:"";position:absolute;left:50%;top:50%;width:2px;height:20px;margin:-10px 0 0 -1px;background:currentColor;box-shadow:-6px 0 currentColor,6px 0 currentColor}
.sp-hint{text-align:center;font-size:13px;color:var(--mut);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.knob,.rbar i{transition:none}}

function mig(s){if(!s.v)['Upper','Push'].forEach(k=>{if(!s.w[k])s.w[k]=clone(DEF[k])});
if((s.v||0)<3){(s.w.Upper||[]).forEach(e=>{if(e.n=='EZ-Bar Cheat Curl (süperset 1)'){e.n='EZ-Bar Cheat Curl';e.ss=1}if(e.n=='EZ-Bar Skull Crusher (süperset 1)')e.n='EZ-Bar Skull Crusher'});s.week=1;s.v=3}return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.w)return mig(s)}catch(e){}
return{v:3,week:1,sched:['Upper','Lower','','Push','Pull','',''],w:clone(DEF),last:{},log:[]}}
function save(){try{S.run=V.run&&V.view=='run'&&(!V.run.done||V.run.mode)?V.run:null;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>(new Date().getDay()+6)%7;
let S=load(),V={view:'splash',day:today(),run:null},actx=null;
if(S.run&&S.w[S.run.w]){V.run=S.run;const r=V.run;if(r.phase=='rest'&&r.nx&&Date.now()>=r.end){r.ei=r.nx.ei;r.si=r.nx.si;r.phase='set'}}else S.run=null;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phase=()=>{const k=S.week||1;return k==1||k==7?0:k<7?1:2};
const same=(w,i,e)=>DEF[w]&&DEF[w][i]&&DEF[w][i].n==e.n;
const rirOf=(w,i,e)=>phase()&&WR[w]&&same(w,i,e)?WR[w][i]:e.rir;
const techOf=(w,i,e)=>phase()==2&&TECH[w]&&same(w,i,e)?TECH[w][i]||'':'';
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtE=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600);return h?h+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):fmt(s)};
const dur=s=>{if(!s)return'';const m=Math.max(1,Math.round(s/60));return m<60?m+' dk':Math.floor(m/60)+' sa '+(m%60)+' dk'};
const elapsed=r=>r&&r.t0?(Date.now()-r.t0)/1000:0;
const app=document.getElementById('app');
// Haftalık şablon S.sched; ertelemeler sadece o takvim haftasına ait S.plan'a yazılır.
const monKey=()=>{const x=new Date();x.setDate(x.getDate()-today());return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
const planOn=()=>!!(S.plan&&S.plan.wk==monKey());
const eff=()=>planOn()?S.plan.days:S.sched;
function postpone(d){const days=eff().slice(),w=days[d];if(!w||d<today())return;
const rem=[];for(let i=d;i<7;i++)if(days[i]&&S.w[days[i]])rem.push(days[i]);
const n=6-d,k=rem.length;if(k>n){V.msg='Bu haftanın kalan günlerine sığmıyor, ertelenemedi.';return}
for(let i=d;i<7;i++)days[i]='';
rem.forEach((x,i)=>{days[k==1?d+1:d+1+Math.round(i*(n-1)/(k-1))]=x});
S.plan={wk:monKey(),days};V.msg=`${w} ${DAYL[d+1]} gününe ertelendi, haftanın kalanı yeniden düzenlendi.`}
const msg=()=>{const m=V.msg;V.msg=null;return m?`<p class="msg" role="status">${esc(m)}</p>`:''};
const CARDIO_G=[
['Salon makineleri (düşük-orta tempo)',['Eğimli yürüyüş (koşu bandı)','Koşu bandında koşu','Merdiven makinesi (StairMaster)','Sabit bisiklet','Yatık bisiklet (recumbent)','Spin bisikleti','Eliptik','Kürek makinesi','Air bike (Assault bike)','SkiErg']],
['HIIT / kondisyon',['Sprint intervalleri','Bisiklette HIIT','Kızak itme (sled push)','Farmer\'s walk','Kettlebell swing','Battle rope','Burpee','İp atlama','Mountain climber','Box jump']],
['Açık hava / diğer',['Tempolu yürüyüş','Açık havada koşu','Yokuş / merdiven çıkma','Doğa yürüyüşü (hiking)','Bisiklet (açık hava)','Yüzme']]];
const CARDIO=CARDIO_G.flatMap(g=>g[1]);
const csec=c=>c?(c.acc||0)+(c.t0?(Date.now()-c.t0)/1000:0):0;
const lr=l=>l.cardio?dur(l.sec)+' kardiyo':(l.s.map(x=>x.skip?'atlandı':x.kg+'×'+x.r).join(', ')+(l.skip?(l.s.length?', kalanı atlandı':'Atlandı'):''));
function addLog(x){const r=V.run;r.log.push(x);if(r.done){const h=S.log[r.li];if(h&&h.log!==r.log)h.log.push(x)}}
const PLATES={Upper:'red',Lower:'blue',Push:'yel',Pull:'grn'},PL=['red','blue','yel','grn'];
const pc=w=>!w||!S.w[w]?'rest':PLATES[w]||PL[Math.max(0,Object.keys(S.w).indexOf(w))%4];
const today8=()=>new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
const wks=()=>`<div class="wks" aria-hidden="true">${[...Array(12)].map((_,i)=>`<span class="${i+1<S.week?'d':i+1==S.week?'c':''}"></span>`).join('')}</div>`;
const nav=(a,t)=>`<button class="li" data-a="${a}"><span>${t}</span><span class="chev" aria-hidden="true">›</span></button>`;
const when=h=>{const d=new Date(h.d);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+', '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+(h.wk?`, ${h.wk}. hafta`:'')+(h.part?', yarım kaldı':'')};
const strip=(sc,td,sel,act='day')=>`<div class="wk">${DAYS.map((d,i)=>{const k=sc[i],ok=k&&S.w[k];return`<button class="${i==td?'td':''} ${i==sel?'on':''}" data-a="${act}" data-i="${i}" ${act=='mv'&&i==sel?'disabled':''} aria-label="${DAYL[i]}: ${ok?esc(k):'dinlenme'}"><b>${d}</b><i class="p-${ok?pc(k):'rest'} ${ok?'':'off'}"></i><small>${ok?esc(k):'Dinlenme'}</small></button>`}).join('')}</div>`;

function splash(){const w=eff()[today()],rw=V.run&&V.run.w,show=rw||(w&&S.w[w]?w:'');
return`<div class="splash"><div class="sp-top"><span class="brand">Antrenman</span><span class="mut">${today8()}</span></div>
<div class="plate sp-plate p-${pc(show)}"><div class="sp-lab">${rw?'Yarım kalan antrenman':'Bugün'}</div><div class="sp-w">${show?esc(show):'Dinlenme'}</div><p class="sp-m">${show?`${S.w[show].length} hareket, programın ${S.week}. haftası.`:'Bugün programda antrenman yok.'}</p></div>
<div><div class="track"><span class="tl">Başlamak için kaydır</span><button class="knob" data-a="enter" aria-label="Uygulamaya gir"></button></div><p class="sp-hint">Ya da ekranı yukarı kaydır.</p></div></div>`}
function enter(){V.view=V.run?'run':'main';render();window.scrollTo(0,0)}

function main(){const td=today(),sc=eff(),w=sc[td],ex=S.w[w]||[],last=S.log[S.log.length-1];
const sets=ex.reduce((a,e)=>a+(+e.sets||0),0),min=Math.round(ex.reduce((a,e)=>a+e.sets*(+e.rest+40),0)/60);
let nxt='';if(!ex.length)for(let k=1;k<7;k++){const j=(td+k)%7,x=j>td?sc[j]:S.sched[j];if(x&&S.w[x]){nxt=x+', '+DAYL[j];break}}
return`<div class="hd"><span class="date">${today8()}</span><select id="wk" class="wsel" data-a="week" aria-label="Program haftası">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${S.week==i+1?'selected':''}>Hafta ${i+1}</option>`).join('')}</select></div>
${wks()}<p class="wkn">12 haftalık programın ${S.week}. haftası${S.week%6==1?', tanıtım haftası':''}.</p>${msg()}
<div class="hd lab"><span>Bugün</span>${ex.length?`<button class="lnk" data-a="post" data-i="${td}">Ertele</button>`:''}</div>
${ex.length?`<div class="plate p-${pc(w)}"><div class="wn">${esc(w)}</div><ul class="pl">${ex.map(e=>`<li><span>${esc(nm(e))}</span><span>${e.sets}×${esc(e.reps)}</span></li>`).join('')}</ul><p class="pm">${sets} set, yaklaşık ${min} dakika.</p><div class="pa"><button class="pbtn" data-a="start" data-i="${td}">Başla</button><button class="lnk" data-a="day" data-i="${td}">Ayrıntılar</button></div></div>`
:`<div class="plate p-rest"><div class="wn">Dinlenme</div><p class="pm" style="margin-bottom:0">${nxt?'Sıradaki antrenman: '+esc(nxt)+'.':'Programa henüz gün atanmamış.'}</p></div>`}
<div class="hd lab"><span>Bu hafta${planOn()?', ertelemeyle düzenlendi':''}</span>${planOn()?'<button class="lnk" data-a="unplan">Sıfırla</button>':''}</div>${strip(sc,td,-1)}
${last?`<div class="lab">Son antrenman</div><div class="list"><div class="row"><div class="grow"><b>${esc(last.w)}</b><span class="sub">${when(last)}</span></div><span class="v">${last.dur?dur(last.dur):''}</span></div></div>`:''}
<div class="list" style="margin-top:24px">${nav('hist','Geçmiş')}${nav('edit','Programı düzenle')}${nav('exp','Yedekle')}${nav('imp','Yedeği geri yükle')}</div>`}

async function exportData(){const name='antrenman-yedek-'+new Date().toISOString().slice(0,10)+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'});
try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Antrenman yedeği'});return}}catch(e){if(e&&e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function day(){const sc=eff(),w=sc[V.day],ex=S.w[w]||[],canPost=V.day>=today()&&V.day<6;
return`<div class="hd"><button class="lnk back" data-a="home">‹ Ana ekran</button><span class="mut">${S.week}. hafta</span></div><h1 class="pt">${DAYL[V.day]}</h1>${strip(sc,today(),V.day)}${msg()}
<div class="lab">${w&&ex.length?`${esc(w)} antrenmanını bu hafta başka güne taşı`:'Bu hafta başka günün antrenmanını buraya al'}</div>${strip(sc,today(),V.day,'mv')}
<p class="mut" style="font-size:13px;margin:8px 0 0">Bir güne dokun. O günde antrenman varsa iki gün yer değiştirir. Sadece bu hafta için geçerli, ana ekrandaki Sıfırla ile geri alınır.</p>
<label class="lab" for="sel">Haftalık programda bu gün (kalıcı)</label>
<select id="sel" data-a="sched"><option value="">Dinlenme</option>${Object.keys(S.w).map(k=>`<option value="${esc(k)}" ${k==w?'selected':''}>${esc(k)}</option>`).join('')}</select>
${w&&ex.length?`<div class="list" style="margin-top:12px">${ex.map((e,i)=>{const t=techOf(w,i,e);return`<div class="row at"><div class="grow"><b>${esc(nm(e))}</b>${e.ss?'<span class="tag">süperset</span>':''}${FOCUS[e.n]?`<span class="sub">${esc(FOCUS[e.n])}</span>`:''}${chips(e)}</div><div class="v"><b class="n">${e.sets}×${esc(e.reps)}</b><span class="sub">${fmt(e.rest)} dinlenme</span>${t?`<span class="sub">${esc(LBL[t][0])}</span>`:''}</div></div>`}).join('')}</div>
<div class="${canPost?'two':''}"><button class="btn" data-a="start">Başla</button>${canPost?`<button class="btn alt" data-a="post" data-i="${V.day}">Ertele</button>`:''}</div>`:'<p class="mut" style="margin-top:14px">Bu gün dinlenme günü.</p>'}
`}

function hist(){return`<div class="hd"><button class="lnk back" data-a="home">‹ Ana ekran</button></div><h1 class="pt">Geçmiş</h1>`+(S.log.length?S.log.map((h,i)=>`<div class="lab hl p-${pc(h.w)}"><span class="sq"></span>${esc(h.w)}</div><div class="list"><div class="row"><span class="mut" style="font-size:13px">${when(h)}</span><span class="v">${h.dur?dur(h.dur):''}</span></div>${h.log.map(l=>`<div class="row at"><span>${esc(l.n)}</span><span class="v">${lr(l)}</span></div>`).join('')}<div class="row"><button class="lnk danger" data-a="delh" data-i="${i}">Kaydı sil</button></div></div>`).reverse().join(''):'<p class="mut">Henüz kayıtlı antrenman yok.</p>')}

// Atlanan hareketler (r.sk) sıralamada ve süperset eşleşmesinde yok sayılır.
function nextPos(r){const ex=S.w[r.w],e=ex[r.ei],sk=r.sk||[],ok=i=>!sk.includes(i);
if(e.ss&&ex[r.ei+1]&&ok(r.ei+1))return{ei:r.ei+1,si:r.si,free:1};
if(r.ei>0&&ex[r.ei-1].ss&&ok(r.ei-1)){if(r.si+1<e.sets)return{ei:r.ei-1,si:r.si+1}}
else if(r.si+1<e.sets)return{ei:r.ei,si:r.si+1};
let j=r.ei+1;while(j<ex.length&&!ok(j))j++;return j<ex.length?{ei:j,si:0}:null}
function finish(r){r.done=true;r.dur=Math.round(elapsed(r));S.log.push({d:new Date().toISOString(),w:r.w,wk:S.week,dur:r.dur,log:r.log});r.li=S.log.length-1}
// Seti atla: set "atlandı" olarak kaydedilir (toplam sete sayılmaz), dinlenme olmadan sıradaki sete geçilir.
function skipSet(r){const e=S.w[r.w][r.ei];let l=r.log.find(x=>x.ei==r.ei);if(!l){l={ei:r.ei,n:nm(e),s:[]};r.log.push(l)}
l.s.push({skip:1});delete r.cs;delete r.dkg;delete r.drp;
const nx=nextPos(r);if(!nx)finish(r);else{r.ei=nx.ei;r.si=nx.si;r.phase='set'}}
const setCount=log=>log.reduce((a,l)=>a+l.s.filter(x=>!x.skip).length,0);
function moveDay(from,to){const days=eff().slice(),a=days[from],b=days[to];days[from]=b;days[to]=a;S.plan={wk:monKey(),days};
V.day=to;V.msg=a&&b?`${a} ${DAYL[to]}, ${b} ${DAYL[from]} gününe geçti.`:a?`${a} ${DAYL[to]} gününe taşındı.`:`${b} ${DAYL[from]} gününe taşındı.`}
// Antrenman sırasında tüm hareketlerin durumunu gösteren açılır liste.
function planList(r){const ex=S.w[r.w],sk=r.sk||[],cur=r.phase=='rest'&&r.nx?r.nx.ei:r.ei;let left=0;
const rows=ex.map((e,i)=>{const s=(r.log.find(l=>l.ei==i)||{s:[]}).s,n=s.length,st=sk.includes(i)||n>=e.sets&&s.every(x=>x.skip)?'sk':i==cur?'cur':n>=e.sets?'ok':'todo';if(st=='todo'||st=='cur')left++;
return`<div class="row pr ${st}"><span>${esc(nm(e))}</span><span class="v">${st=='ok'?'bitti':st=='sk'?'atlandı':st=='cur'?(r.phase=='rest'?'sıradaki':'şimdi')+`, ${n}/${e.sets}`:n?`${n}/${e.sets} set`:`${e.sets}×${esc(e.reps)}`}</span></div>`}).join('');
return`<details class="up" ${V.plo?'open':''}><summary data-a="plo"><span>Antrenman planı</span><span class="mut">${left} hareket kaldı</span></summary><div class="list">${rows}</div></details>`}
function nextOf(r){const n=r.nx;return`${nm(S.w[r.w][n.ei])}, set ${n.si+1}`}

function pickV(){const mine=(S.cxl||[]).filter(c=>!CARDIO.includes(c)),li=c=>`<button class="li" data-a="cpick" data-v="${esc(c)}"><span>${esc(c)}</span><span class="chev" aria-hidden="true">›</span></button>`;
return`<div class="hd"><button class="lnk back" data-a="ccancel">‹ Geri</button></div><h1 class="pt">Kardiyo ekle</h1>${mine.length?`<div class="lab">Senin eklediklerin</div><div class="list">${mine.map(li).join('')}</div>`:''}${CARDIO_G.map(g=>`<div class="lab">${esc(g[0])}</div><div class="list">${g[1].map(li).join('')}</div>`).join('')}
<label class="lab" for="cc">Listede yoksa kendin yaz</label><div class="inl"><input id="cc" placeholder="Örneğin yüzme"><button class="btn" data-a="ccustom">Ekle</button></div><p class="mut" style="font-size:13px">Yazdığın seçenek bir dahaki sefere listede olur.</p>`}
function cardioV(r){const c=r.cx,on=!!c.t0;
return`<div class="rh"><button class="lnk" data-a="ccancel">Vazgeç</button><span class="clk">${r.t0&&!r.done?`<span id="el">${fmtE(elapsed(r))}</span>`:''}</span><span class="rn">Kardiyo</span></div>
<h1 class="xt">${esc(c.n)}</h1><div class="timer" id="cx">${fmtE(csec(c))}</div>
<div class="two"><button class="btn ${on?'alt':''}" data-a="${on?'cpause':'cstart'}">${on?'Duraklat':c.acc?'Devam et':'Başlat'}</button><button class="btn alt" data-a="csave">Bitir ve kaydet</button></div>
<label class="lab" for="cm">Ya da süreyi elle gir (dakika)</label><div class="inl"><input id="cm" type="number" inputmode="decimal" min="1" placeholder="Örneğin 20"><button class="btn alt" data-a="cman">Kaydet</button></div>`}

function run(){const r=V.run,ex=S.w[r.w],e=ex[r.ei],p='p-'+pc(r.w);
if(r.mode=='pick')return pickV();
if(r.mode=='cardio'&&r.cx)return cardioV(r);
if(r.done){const n=setCount(r.log);return`<h1 class="pt" style="margin-top:14px">Antrenman bitti</h1><p class="lead">${r.dur?dur(r.dur)+', ':''}${n} set.</p><div class="list">${r.log.map(l=>`<div class="row at"><b>${esc(l.n)}</b><span class="v">${lr(l)}</span></div>`).join('')}</div><button class="btn alt" data-a="pick">Kardiyo ekle</button><button class="btn" data-a="home">Ana ekrana dön</button>`}
const head=`<div class="rh"><button class="lnk" data-a="quit">Bitir</button><span class="clk">${r.t0?`<span id="el">${fmtE(elapsed(r))}</span>`:''}</span><span class="rn">${r.ei+1}/${ex.length}</span></div><div class="prog ${p}"><i style="width:${r.ei/ex.length*100}%"></i></div>`;
if(r.phase=='rest'){const rem=Math.ceil((r.end-Date.now())/1000);return head+`<div class="lab">Dinlenme</div><div class="timer" id="t">${fmt(rem)}</div><div class="rbar ${p}"><i id="tb" style="width:${r.rt?Math.max(0,Math.min(100,rem/r.rt*100)):0}%"></i></div><p class="nx">Sıradaki: <b>${esc(nextOf(r))}</b></p><div class="two"><button class="btn alt" data-a="add" data-v="-15">−15 sn</button><button class="btn alt" data-a="add" data-v="15">+15 sn</button></div><button class="btn" data-a="skip">Dinlenmeyi geç</button>${planList(r)}`}
const cn=nm(e),lw=S.last[cn]||{},rr=rirOf(r.w,r.ei,e),tq=r.si==e.sets-1?techOf(r.w,r.ei,e):'';
return head+`<h1 class="xt">${esc(cn)}</h1>${FOCUS[e.n]?`<p class="focus">Odak: ${esc(FOCUS[e.n])}</p>`:''}${chips(e)}
<div class="kv"><div><small>Set</small><b>${r.si+1}/${e.sets}</b></div><div><small>Hedef tekrar</small><b>${esc(e.reps)}</b></div>${rr&&rr[r.si]!=null?`<div><small>RIR</small><b>${rr[r.si]}</b></div>`:''}</div>
${e.note&&cn==e.n?`<p class="tip">${esc(e.note)}</p>`:''}${tq?`<p class="tip"><b>Son set tekniği: ${LBL[tq][0]}.</b> ${LBL[tq][1]}</p>`:''}${e.ss?'<p class="tip">Süperset: bu seti bitirince dinlenmeden sıradaki harekete geç.</p>':''}
<div class="two"><label>Ağırlık (kg)<input id="kg" type="number" inputmode="decimal" step="0.5" value="${r.dkg??lw.kg??''}"></label><label>Tekrar<input id="rp" type="number" inputmode="numeric" value="${r.drp??''}"></label></div><button class="btn" data-a="ok">Seti kaydet</button>
${r.cs?`<p class="tip">${r.si+1}. set yapılmadan "atlandı" olarak kaydedilecek ve dinlenme olmadan ${r.si+1<e.sets?'sıradaki sete':'sıradaki harekete'} geçilecek.</p><div class="two"><button class="btn alt" data-a="skipno">Vazgeç</button><button class="btn dng" data-a="skipx">Evet, seti atla</button></div>`:'<button class="lnk" data-a="skipx">Bu seti atla</button>'}${planList(r)}`}

function edit(){const at=(k,w,i)=>`data-w="${esc(w)}" data-i="${i}" data-k="${k}"`;
return`<div class="hd"><button class="lnk back" data-a="home">‹ Ana ekran</button></div><h1 class="pt">Program</h1>`+Object.keys(S.w).map(k=>`<div class="list" style="margin-bottom:16px"><div class="row p-${pc(k)}"><span class="sq"></span><input data-k="wn" data-w="${esc(k)}" value="${esc(k)}" aria-label="Antrenman adı" style="font-weight:700"><button class="lnk danger" data-a="delw" data-w="${esc(k)}">Sil</button></div>
${S.w[k].map((e,i)=>`<div class="ex"><input ${at('n',k,i)} value="${esc(e.n)}" aria-label="Hareket adı"><div class="g3"><label>Set<input type="number" ${at('sets',k,i)} value="${e.sets}"></label><label>Tekrar<input ${at('reps',k,i)} value="${esc(e.reps)}"></label><label>Dinlenme (sn)<input type="number" ${at('rest',k,i)} value="${e.rest}"></label></div><div class="exa"><label class="chk"><input type="checkbox" ${at('ss',k,i)} ${e.ss?'checked':''}>Sonraki hareketle süperset</label><button class="lnk danger" data-a="delx" data-w="${esc(k)}" data-i="${i}">Hareketi sil</button></div></div>`).join('')}
<div class="row"><button class="lnk" data-a="addx" data-w="${esc(k)}">Hareket ekle</button></div></div>`).join('')+`<button class="btn alt" data-a="addw">Yeni antrenman ekle</button>`}

function render(){app.innerHTML=V.view=='splash'?splash():V.view=='run'?run():V.view=='edit'?edit():V.view=='hist'?hist():V.view=='day'?day():main()}

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(actx.currentTime+.4)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function advance(){const r=V.run;r.ei=r.nx.ei;r.si=r.nx.si;r.phase='set';beep();save();render()}
setInterval(()=>{const r=V.run;if(V.view!='run'||!r)return;if(r.cx){const c=document.getElementById('cx');if(c)c.textContent=fmtE(csec(r.cx))}if(r.done)return;const el=document.getElementById('el');if(el)el.textContent=fmtE(elapsed(r));if(r.phase!='rest'||r.mode)return;const rem=Math.ceil((r.end-Date.now())/1000);if(rem<=0)advance();else{const t=document.getElementById('t');if(t)t.textContent=fmt(rem);const tb=document.getElementById('tb');if(tb&&r.rt)tb.style.width=Math.max(0,Math.min(100,rem/r.rt*100))+'%'}},250);

app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName=='SELECT')return;const a=b.dataset.a,d=b.dataset,r=V.run;
if(a=='enter'){if(ev.detail===0)enter();return}
if(a=='day'){V.day=+d.i;V.view='day'}
else if(a=='post')postpone(+d.i);
else if(a=='unplan'){S.plan=null;V.msg='Bu hafta yeniden şablon programa döndü.'}
else if(a=='pick'){r.mode='pick'}
else if(a=='cpick'){r.mode='cardio';r.cx={n:d.v,acc:0,t0:null}}
else if(a=='ccustom'){const i=document.getElementById('cc'),v=i.value.trim();if(!v){i.focus();return}S.cxl=S.cxl||[];if(!CARDIO.includes(v)&&!S.cxl.includes(v))S.cxl.push(v);r.mode='cardio';r.cx={n:v,acc:0,t0:null}}
else if(a=='cstart'){r.cx.t0=Date.now();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
else if(a=='cpause'){r.cx.acc=csec(r.cx);r.cx.t0=null}
else if(a=='csave'||a=='cman'){let sec;if(a=='cman'){const i=document.getElementById('cm'),m=parseFloat(String(i.value).replace(',','.'));if(!(m>0)){i.focus();return}sec=Math.round(m*60)}else{sec=Math.round(csec(r.cx));if(sec<1)return}
 addLog({ei:-1,n:r.cx.n,cardio:1,sec,s:[]});r.mode=null;r.cx=null}
else if(a=='ccancel'){r.mode=null;r.cx=null}
else if(a=='edit')V.view='edit';
else if(a=='home'){V.view='main';V.run=null}
else if(a=='start'){if(d.i!=null)V.day=+d.i;const w=eff()[V.day];if(!S.w[w])return;V.run={w,ei:0,si:0,phase:'set',log:[],t0:Date.now()};V.view='run';try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
else if(a=='hist')V.view='hist';
else if(a=='delh'){S.log.splice(+d.i,1)}
else if(a=='quit'){if(r.log.length)S.log.push({d:new Date().toISOString(),w:r.w,wk:S.week,part:1,dur:Math.round(elapsed(r)),log:r.log});V.view='main';V.run=null}
else if(a=='ok'){const kg=document.getElementById('kg').value,rp=document.getElementById('rp').value;if(rp===''){document.getElementById('rp').focus();return}
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 const ex=S.w[r.w],e=ex[r.ei],cn=nm(e);let l=r.log.find(x=>x.ei==r.ei);if(!l){l={ei:r.ei,n:cn,s:[]};r.log.push(l)}
 l.n=cn;l.s.push({kg:kg||'0',r:rp});S.last[cn]={kg};delete r.dkg;delete r.drp;
 const nx=nextPos(r);
 delete r.cs;
 if(!nx)finish(r)
 else if(nx.free){r.ei=nx.ei;r.si=nx.si}
 else{r.nx=nx;r.phase='rest';r.rt=+e.rest;r.end=Date.now()+e.rest*1000}
 save()}
else if(a=='alt'){S.pick=S.pick||{};if(d.v==d.o)delete S.pick[d.o];else S.pick[d.o]=d.v;if(r&&!r.done&&r.phase=='set')delete r.dkg}
else if(a=='exp'){exportData();return}
else if(a=='imp'){document.getElementById('impf').click();return}
else if(a=='add'){r.end+=+d.v*1000;r.rt=Math.max(1,(r.rt||0)+ +d.v)}
else if(a=='skip'){advance();return}
else if(a=='skipx'){if(!r.cs)r.cs=1;else skipSet(r)}
else if(a=='skipno'){delete r.cs}
else if(a=='plo'){ev.preventDefault();V.plo=!V.plo;render();return}
else if(a=='mv'){moveDay(V.day,+d.i)}
else if(a=='addx'){S.w[d.w].push(X('Yeni hareket',3,'8-10',90,[],''));save()}
else if(a=='delx'){S.w[d.w].splice(+d.i,1);save()}
else if(a=='addw'){let n=Object.keys(S.w).length+1,k='Antrenman '+n;while(S.w[k])k='Antrenman '+(++n);S.w[k]=[];save()}
else if(a=='delw'){delete S.w[d.w];S.sched=S.sched.map(x=>x==d.w?'':x);if(S.plan)S.plan.days=S.plan.days.map(x=>x==d.w?'':x);save()}
save();render()});
app.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;if((t.id=='kg'||t.id=='rp')&&V.run){V.run['d'+t.id]=t.value;save();return}if(!d.k||d.k=='wn')return;const e=S.w[d.w]&&S.w[d.w][+d.i];if(!e)return;
e[d.k]=t.type=='checkbox'?(t.checked?1:0):(d.k=='sets'||d.k=='rest')?Math.max(1,Number(t.value)||1):t.value;save()});
app.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.a=='sched'){S.sched[V.day]=t.value;if(planOn())S.plan.days[V.day]=t.value;save();render()}
else if(d.a=='week'){S.week=+t.value;save();render()}
else if(d.k=='wn'){const n=t.value.trim();if(n&&n!=d.w&&!S.w[n]){S.w[n]=S.w[d.w];delete S.w[d.w];S.sched=S.sched.map(x=>x==d.w?n:x);if(S.plan)S.plan.days=S.plan.days.map(x=>x==d.w?n:x);save()}render()}});
// Giriş ekranı: düğmeyi sağa sürükle ya da ekranı yukarı kaydır.
let drag=null;
app.addEventListener('pointerdown',ev=>{if(V.view!='splash')return;const k=ev.target.closest('.knob');
if(k){const t=k.parentElement;drag={k,t,x0:ev.clientX,x:0,max:t.clientWidth-k.offsetWidth-8};try{k.setPointerCapture(ev.pointerId)}catch(e){}k.style.transition='none'}else drag={y0:ev.clientY}});
app.addEventListener('pointermove',ev=>{if(!drag||!drag.k)return;drag.x=Math.max(0,Math.min(drag.max,ev.clientX-drag.x0));drag.k.style.transform=`translateX(${drag.x}px)`;drag.t.querySelector('.tl').style.opacity=1-drag.x/drag.max});
function dragEnd(ev,cancel){if(!drag)return;const g=drag;drag=null;
if(g.k){g.k.style.transition='';if(!cancel&&g.x>g.max*.7){g.k.style.transform=`translateX(${g.max}px)`;setTimeout(enter,180)}else{g.k.style.transform='';g.t.querySelector('.tl').style.opacity=''}}
else if(!cancel&&g.y0-ev.clientY>60)enter()}
app.addEventListener('pointerup',ev=>dragEnd(ev));app.addEventListener('pointercancel',ev=>dragEnd(ev,1));
document.getElementById('impf').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
try{const s=JSON.parse(await f.text());if(!s||!s.w||!Array.isArray(s.sched))throw 0;
if(!confirm('Yedek geri yüklensin mi? Bu cihazdaki mevcut kayıtların yerini alacak.'))return;
S=mig(s);S.run=null;V={view:'main',day:today(),run:null};save();render();alert('Yedek geri yüklendi.')}
catch(e){alert('Bu dosya geçerli bir antrenman yedeği değil.')}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
